<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0d12" />
    <title>Ruang Tumbuh — sedang luring</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100dvh;
      }
      body {
        display: grid;
        place-items: center;
        padding: max(1.25rem, env(safe-area-inset-top)) 1.25rem max(1.25rem, env(safe-area-inset-bottom));
        background-color: #0b0d12;
        background-image:
          radial-gradient(circle at 10% 0%, rgba(139, 124, 255, 0.16), transparent 30%),
          radial-gradient(circle at 90% 10%, rgba(64, 215, 192, 0.1), transparent 28%);
        color: #f5f7fb;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
        text-align: center;
      }
      main {
        max-width: 22rem;
      }
      .kicker {
        font-size: 0.62rem;
        letter-spacing: 0.09em;
        text-transform: uppercase;
        color: #69717f;
        margin: 0 0 0.9rem;
      }
      h1 {
        font-size: 1.5rem;
        font-weight: 600;
        letter-spacing: -0.02em;
        margin: 0 0 0.6rem;
      }
      p {
        color: #969ead;
        font-size: 0.88rem;
        line-height: 1.6;
        margin: 0 0 1.4rem;
      }
      button {
        min-height: 44px;
        padding: 0 1.4rem;
        border-radius: 0.75rem;
        border: 1px solid rgba(139, 124, 255, 0.35);
        background: rgba(139, 124, 255, 0.14);
        color: #f5f7fb;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }
      button:focus-visible {
        outline: 2px solid rgba(139, 124, 255, 0.55);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="kicker">ruang tumbuh</p>
      <h1>Sedang tidak ada koneksi</h1>
      <p>
        Halaman ini belum tersimpan untuk dibuka luring. Sambungkan internet lagi,
        lalu coba muat ulang — datamu tetap aman di server.
      </p>
      <button type="button" onclick="location.reload()">Coba lagi</button>
    </main>
  </body>
</html>
